# This workflow runs lint and tests with a variety of Python versions using uv.
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Test

on:
  push:
    branches: [ master, dev ]
  pull_request:


jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    steps:
    - uses: actions/checkout@v5
    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --locked
    - name: Lint with ruff
      run: |
        uv run ruff check --output-format=github .
        uv run ruff format --check .
    - name: Run tests with coverage
      run: |
        uv run coverage run -m unittest discover
        uv run coverage combine
        uv run coverage xml

    - name: Upload coverage
      # Only upload from one job in the matrix
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml # optional
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true # optional (default = false)
        verbose: true # optional (default = false)

  # Single status for branch protection to require, so matrix changes don't need protection updates.
  # always() makes this report failure (rather than be skipped) when a matrix job fails.
  all-tests:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Check that all matrix jobs passed
      run: test "${{ needs.build.result }}" = "success"
