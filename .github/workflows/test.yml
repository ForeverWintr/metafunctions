# This workflow runs lint and tests with a variety of Python versions using uv.
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Test

on:
  push:
    branches: [ master, dev ]
  pull_request:


jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    steps:
    - uses: actions/checkout@v5
    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --locked
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 . --extend-exclude .venv --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 . --extend-exclude .venv --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run tests with coverage
      run: |
        uv run coverage run -m unittest discover
        uv run coverage combine
        uv run coverage xml

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml # optional
        fail_ci_if_error: true # optional (default = false)
        verbose: true # optional (default = false)
